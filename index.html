<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AgriAR — AR Sensor Dashboard</title>

  <!-- A-Frame: the WebXR / 3D framework we build on -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== 2D UI overlay (HTML sits on top of the 3D canvas) ===== -->
  <div id="ui">
    <header id="topbar">
      <span class="logo">🌱 AgriAR</span>
      <span id="status">Step 1 — scene running</span>
    </header>
  </div>

  <!-- ===== 3D scene ===== -->
  <a-scene
    id="scene"
    background="color: #101915"
    renderer="colorManagement: true; antialias: true">

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>

    <!-- Placeholder content — replaced by real models in Step 3+ -->
    <a-box
      position="0 1.2 -3"
      rotation="0 45 0"
      color="#4caf50"
      shadow
      animation="property: rotation; to: 0 405 0; loop: true; dur: 6000; easing: linear">
    </a-box>

    <a-plane position="0 0 -3" rotation="-90 0 0" width="6" height="6" color="#1e2b22"></a-plane>

    <a-sky color="#0c130f"></a-sky>

    <!-- Default camera with orbit-style look controls for desktop preview -->
    <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>
  </a-scene>

  <script src="js/app.js"></script>
</body>
</html>
