<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AgriAR — Markerless AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- This #ui element is handed to WebXR as the dom-overlay, so it stays
       visible on top of the camera feed during the AR session. -->
  <div id="ui">
    <header id="topbar">
      <button id="back" class="btn btn--ghost">‹ Menu</button>
      <span class="logo">📡 Markerless AR</span>
      <button id="xr-debug-btn" class="btn" title="WebXR debug log">🐞</button>
      <button id="sound" class="btn" aria-pressed="false">🔇</button>
      <span id="status">loading…</span>
    </header>

    <form id="city-form" class="searchbar panel">
      <input type="text" placeholder="Search a city for live weather…" autocomplete="off" />
      <button type="submit" class="btn">Go</button>
    </form>

    <div id="hint" class="hint">Press <strong>Enter AR</strong>, then move your phone to scan the floor.</div>

    <div id="controls" class="controls" hidden>
      <button id="reset" class="btn">Re-place</button>
      <button id="refresh" class="btn">↻ Weather</button>
    </div>
  </div>

  <a-scene
    renderer="colorManagement: true; antialias: true"
    loading-screen="enabled: false"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: dom-overlay; overlayElement: #ui"
    hit-place="reticle: #reticle"
    xr-mode-ui="enabled: true; XRMode: ar">

    <a-assets timeout="15000">
      <a-asset-item id="turbine" src="assets/models/turbine.glb"></a-asset-item>
      <a-asset-item id="crop" src="assets/models/crop.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; castShadow: true" position="1 4 2"></a-entity>

    <!-- primitive fallbacks (cloned in if a .glb fails) -->
    <a-entity id="turbine-fallback" visible="false">
      <a-cylinder radius="0.04" height="1.6" position="0 0.8 0" color="#dfe6e1"></a-cylinder>
      <a-cone radius-bottom="0.12" radius-top="0" height="0.3" position="0 1.7 0" color="#9aa7a0"></a-cone>
    </a-entity>
    <a-entity id="crop-fallback" visible="false">
      <a-sphere radius="0.18" position="0 0.3 0" color="#3f9b45"></a-sphere>
    </a-entity>

    <!-- hit-test reticle -->
    <a-entity id="reticle" visible="false">
      <a-ring rotation="-90 0 0" radius-inner="0.06" radius-outer="0.085"
        material="color: #7ede6c; shader: flat; opacity: 0.9; transparent: true; side: double"></a-ring>
    </a-entity>

    <!-- ===== the farm scene: hidden until the user taps a detected surface ===== -->
    <a-entity id="farm" visible="false" scale="0.16 0.16 0.16"
      gesture-transform="min: 0.05; max: 0.45">

      <!-- shared ground field: solid, sunk just below the models -->
      <a-box id="field-top-ml" position="0.3 -0.03 0" depth="1.8" width="2.6" height="0.06"
        material="color: #5cae4e; roughness: 1"></a-box>
      <a-box id="field-base-ml" position="0.3 -0.062 0" depth="1.9" width="2.7" height="0.02"
        material="color: #2f5d29; roughness: 1"></a-box>

      <!-- Model A: wind turbine — blades + yaw driven by live wind -->
      <a-entity id="turbine-ent" position="-0.55 0 0"
        gltf-model="#turbine" gltf-fallback="#turbine-fallback"
        scale="0.55 0.55 0.55"
        spin-part="part: windturbine_tall_fan; axis: z; speed: 120"></a-entity>

      <!-- live weather visuals -->
      <a-entity weather-fx="turbine: #turbine-ent; crop: #crop-markerless;
        field: #field-top-ml; fieldBase: #field-base-ml;
        panel: #ml-readout; panelRoot: #ml-panel"></a-entity>

      <!-- Model B: crop plot — colour driven by live air quality (Step 6) -->
      <a-entity id="crop-markerless" position="0.9 0.005 0"
        gltf-model="#crop" gltf-fallback="#crop-fallback"
        scale="0.06 0.06 0.06"></a-entity>

      <a-sphere position="-0.55 1.1 0" radius="0.04" color="#7CFC00"
        animation="property: material.opacity; from: 1; to: 0.15; dir: alternate; loop: true; dur: 700"></a-sphere>

      <!-- live-data panel (hidden until Step 6) -->
      <a-entity id="ml-panel" visible="false" position="0.1 1.9 0" billboard>
        <a-plane width="1.3" height="0.55" material="color: #0c1a12; opacity: 0.82; transparent: true; side: double"></a-plane>
        <a-entity id="ml-readout" position="0 0 0.01"
          text="value: ; align: center; width: 1.7; color: #eafaf0; wrapCount: 26"></a-entity>
      </a-entity>
    </a-entity>

    <a-camera look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
  </a-scene>

  <script src="js/gltf-fallback.js"></script>
  <script src="js/spin-part.js"></script>
  <script src="js/billboard.js"></script>
  <script src="js/gesture-transform.js"></script>
  <script src="js/hit-place.js"></script>
  <script src="js/weather-fx.js"></script>
  <script src="js/ar-shell.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sound-toggle.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/city-search.js"></script>
  <script src="js/xr-debug.js"></script>
  <script src="js/markerless.js"></script>
</body>
</html>
