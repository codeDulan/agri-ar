<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AgriAR — Marker AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ui">
    <header id="topbar">
      <button id="back" class="btn btn--ghost">‹ Menu</button>
      <span class="logo">🎯 Marker AR</span>
      <span id="status">loading…</span>
    </header>
    <div class="hint">Step 3 will add AR.js + Hiro marker tracking here.</div>
  </div>

  <a-scene background="color: #101915" renderer="colorManagement: true">
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>
    <a-box position="0 1.2 -3" color="#4caf50"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-box>
    <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>
  </a-scene>

  <script src="js/ar-shell.js"></script>
</body>
</html>
