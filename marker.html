<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AgriAR — Marker AR</title>

  <!-- A-Frame first, then the AR.js build that plugs into it -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ui">
    <header id="topbar">
      <button id="back" class="btn btn--ghost">‹ Menu</button>
      <span class="logo">🎯 Marker AR</span>
      <span id="status">starting camera…</span>
    </header>

    <div id="scan-hint" class="hint">
      Point the camera at the <strong>Hiro</strong> marker.
      <a href="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png"
         target="_blank" rel="noopener">Open / print marker ›</a>
    </div>
  </div>

  <!-- embedded = render into the page rather than take over the whole document.
       AR.js still overlays the webcam video full-screen behind the canvas. -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; antialias: true; alpha: true"
    arjs="sourceType: webcam; detectionMode: mono; matrixCodeType: 3x3; debugUIEnabled: false;">

    <!-- Lighting travels with the scene, not the marker -->
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.85; castShadow: true" position="1 3 2"></a-entity>

    <!-- Everything inside <a-marker> only renders while the marker is visible -->
    <a-marker id="hiro" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.01">

      <!-- Placeholder "sensor station" built from primitives.
           Step 4 swaps this group for an optimised .glb model. -->
      <a-entity id="station" position="0 0 0" scale="0.6 0.6 0.6"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">

        <!-- ground pad -->
        <a-cylinder position="0 0.02 0" radius="0.9" height="0.04" color="#3b5a44"></a-cylinder>
        <!-- mast -->
        <a-box position="0 0.7 0" depth="0.06" width="0.06" height="1.4" color="#9aa7a0"></a-box>
        <!-- sensor head -->
        <a-box position="0 1.45 0" depth="0.28" width="0.28" height="0.2" color="#2f6b3f"></a-box>
        <!-- solar panel -->
        <a-box position="0 1.05 0.28" rotation="35 0 0" depth="0.02" width="0.5" height="0.34" color="#1b3a63"></a-box>
        <!-- blinking status LED -->
        <a-sphere position="0.1 1.5 0.12" radius="0.03" color="#7CFC00"
          animation="property: material.opacity; from: 1; to: 0.15; dir: alternate; loop: true; dur: 700"></a-sphere>
      </a-entity>

      <!-- Floating label above the station -->
      <a-entity position="0 1.9 0" rotation="-90 0 0"
        text="value: Field Sensor 01; align: center; width: 3; color: #eafaf0"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="js/ar-shell.js"></script>
  <script src="js/marker.js"></script>
</body>
</html>
