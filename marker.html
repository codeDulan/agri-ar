<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AgriAR — Marker AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="ui">
    <header id="topbar">
      <button id="back" class="btn btn--ghost">‹ Menu</button>
      <span class="logo">🎯 Marker AR</span>
      <span id="status">starting camera…</span>
    </header>

    <div id="scan-hint" class="hint">
      Point the camera at the <strong>Hiro</strong> marker.
      <a href="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png"
         target="_blank" rel="noopener">Open / print marker ›</a>
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; antialias: true; alpha: true"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    arjs="sourceType: webcam; detectionMode: mono; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-assets timeout="15000">
      <!-- Model A: wind turbine (also used, and animated by live wind, in markerless mode) -->
      <a-asset-item id="turbine" src="assets/models/turbine.glb"></a-asset-item>
      <!-- Model B: crop / plant cluster (colour driven by live air quality) -->
      <a-asset-item id="crop" src="assets/models/crop.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.85; castShadow: true" position="1 3 2"></a-entity>

    <!-- ===== primitive fallbacks (hidden; cloned in only if a .glb fails) ===== -->
    <a-entity id="turbine-fallback" visible="false">
      <a-cylinder radius="0.04" height="1.6" position="0 0.8 0" color="#dfe6e1"></a-cylinder>
      <a-cone radius-bottom="0.12" radius-top="0" height="0.3" position="0 1.7 0" color="#9aa7a0"
        rotation="0 0 0"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 3000; easing: linear"></a-cone>
    </a-entity>
    <a-entity id="crop-fallback" visible="false">
      <a-sphere radius="0.18" position="0 0.3 0" color="#3f9b45"></a-sphere>
      <a-cylinder radius="0.03" height="0.3" position="0 0.15 0" color="#6b4f2a"></a-cylinder>
    </a-entity>

    <a-marker id="hiro" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.01">

      <a-entity id="station" position="0 0 0">

        <!-- shared ground: one flat rectangular field under both models -->
        <a-plane position="0.05 0.004 0" rotation="-90 0 0" width="1.9" height="1.4"
          material="color: #5cae4e; opacity: 0.28; transparent: true; side: double"></a-plane>
        <a-entity position="0.05 0.006 0" rotation="-90 0 0"
          geometry="primitive: plane; width: 1.9; height: 1.4"
          material="color: #3f7d34; opacity: 0.55; transparent: true; wireframe: true"></a-entity>

        <!-- Model A: wind turbine (hero, centre-left) -->
        <a-entity position="-0.35 0 0" rotation="0 0 0"
          gltf-model="#turbine" gltf-fallback="#turbine-fallback"
          scale="0.45 0.45 0.45"
          spin-part="part: windturbine_tall_fan; axis: z; speed: 120"></a-entity>

        <!-- Model B: crop plot (right, flat) -->
        <a-entity id="crop-marker" position="0.45 0 0.1" rotation="0 0 0"
          gltf-model="#crop" gltf-fallback="#crop-fallback"
          scale="0.6 0.6 0.6"></a-entity>

        <!-- blinking status LED -->
        <a-sphere position="-0.35 1.0 0" radius="0.03" color="#7CFC00"
          animation="property: material.opacity; from: 1; to: 0.15; dir: alternate; loop: true; dur: 700"></a-sphere>
      </a-entity>

      <!-- data panel (hidden until Step 6 wires live values in) -->
      <a-entity id="marker-panel" visible="false" position="0 1.35 0" rotation="-90 0 0">
        <a-plane width="1.4" height="0.4" material="color: #0c1a12; opacity: 0.75; transparent: true"></a-plane>
        <a-entity id="marker-readout" position="0 0 0.01"
          text="value: ; align: center; width: 1.9; color: #eafaf0"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script src="js/gltf-fallback.js"></script>
  <script src="js/spin-part.js"></script>
  <script src="js/ar-shell.js"></script>
  <script src="js/marker.js"></script>
</body>
</html>
